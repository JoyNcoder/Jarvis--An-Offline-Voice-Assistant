<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Jarvis</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/orb.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-hex" viewBox="0 0 24 24"><path d="M12 2.5 20.5 7.25v9.5L12 21.5 3.5 16.75v-9.5z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-4 3.5V16H4z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-micoff" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 11.5 5.3M19 11a7 7 0 0 1-.4 2.3M12 18v3M3 3l18 18"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
  <symbol id="i-restart" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></symbol>
  <symbol id="i-ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
</svg>

<div id="stage">
  <div id="app" data-view="chat" data-mode="expanded">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

    <div class="window">

      <!-- icon rail -->
      <nav class="rail" aria-label="Main">
        <button class="rail-btn on" id="rail-chat" aria-label="Conversation" title="Conversation"><svg class="ic"><use href="#i-chat"/></svg></button>
        <button class="rail-btn" id="rail-settings" aria-label="Settings" title="Settings"><svg class="ic"><use href="#i-hex"/></svg></button>
      </nav>

      <div class="main">

        <!-- chat view -->
        <section class="view" id="view-chat" aria-label="Conversation">
          <header class="bar pywebview-drag-region">
            <span class="wordmark">JARVIS</span>
            <div style="display:flex;gap:8px">
              <button class="icon-btn" id="btn-compact" aria-label="Switch to compact mode" title="Compact Mode"><svg class="ic"><use href="#i-expand"/></svg></button>
              <button class="icon-btn win-min" aria-label="Minimize" title="Minimize"><svg class="ic"><use href="#i-minus"/></svg></button>
              <button class="icon-btn win-close" aria-label="Close" title="Close"><svg class="ic"><use href="#i-close"/></svg></button>
            </div>
          </header>
          <div class="orb-zone" id="orb-chat"></div>
          <div class="transcript" id="transcript" aria-live="polite"></div>
          <form class="inputbar" id="form-send" autocomplete="off">
            <button type="button" class="round-btn" id="btn-new-chat" aria-label="Restart conversation" title="Restart conversation"><svg class="ic"><use href="#i-restart"/></svg></button>
            <input class="pill" id="input-text" type="text" aria-label="Type a message to Jarvis" placeholder="Type a message, or just speak">
            <button type="button" class="round-btn" id="btn-stop" aria-label="Stop speaking" title="Stop speaking"><svg class="ic ic-fill" style="width:14px;height:14px"><use href="#i-stop"/></svg></button>
            <button type="button" class="round-btn mute-btn js-mute" id="btn-mute" aria-pressed="false" aria-label="Mute microphone" title="Mute microphone">
              <svg class="ic ic-on"><use href="#i-mic"/></svg><svg class="ic ic-off"><use href="#i-micoff"/></svg>
            </button>
          </form>
        </section>

        <!-- settings view (replaces the chat area) -->
        <section class="view" id="view-settings" aria-label="Settings">
          <header class="set-head pywebview-drag-region">
            <div class="orb-slot" id="orb-settings"></div>
            <h1>SETTINGS</h1>
            <button class="icon-btn win-close" style="margin-left:auto" aria-label="Close" title="Close"><svg class="ic"><use href="#i-close"/></svg></button>
          </header>
          <nav class="tabs" id="tabs" role="tablist" aria-label="Settings sections"></nav>
          <div class="set-body" id="set-body"></div>
        </section>
      </div>

      <!-- compact mode -->
      <section class="view-full" id="view-compact" aria-label="Compact Jarvis">
        <div class="pywebview-drag-region" style="position:absolute;top:0;left:0;right:0;bottom:90px;z-index:1"></div>
        <div id="orb-compact"></div>
        <p class="compact-reply" id="compact-reply"><span>Say something to Jarvis.</span></p>
        <div class="compact-controls">
          <button class="round-btn big mute-btn js-mute" aria-pressed="false" aria-label="Mute microphone">
            <svg class="ic ic-on"><use href="#i-mic"/></svg><svg class="ic ic-off"><use href="#i-micoff"/></svg>
          </button>
          <button class="round-btn big" id="btn-expand" aria-label="Expand to full window" title="Expand"><svg class="ic"><use href="#i-expand"/></svg></button>
        </div>
      </section>

      <!-- quit: saving memories -->
      <section class="view-full" id="view-quit" aria-label="Saving memories">
        <div id="orb-quit"></div>
        <h2 id="quit-title">SAVING YOUR MEMORIES</h2>
        <p class="sub" id="quit-sub">Jarvis will close as soon as this finishes.</p>
        <ul class="steps" id="quit-steps">
          <li data-step="saving"><svg class="ic s-done"><use href="#i-check"/></svg><svg class="ic s-active"><use href="#i-dot"/></svg><svg class="ic s-pend"><use href="#i-ring"/></svg><span>Conversation saved</span></li>
          <li data-step="extracting"><svg class="ic s-done"><use href="#i-check"/></svg><svg class="ic s-active"><use href="#i-dot"/></svg><svg class="ic s-pend"><use href="#i-ring"/></svg><span>Extracting facts</span></li>
          <li data-step="summarizing"><svg class="ic s-done"><use href="#i-check"/></svg><svg class="ic s-active"><use href="#i-dot"/></svg><svg class="ic s-pend"><use href="#i-ring"/></svg><span>Writing the session summary</span></li>
        </ul>
        <div class="progress" role="progressbar" aria-label="Saving progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="quit-bar"></div></div>
        <div class="quit-foot"><button id="btn-quit-now" hidden>Quit now</button></div>
      </section>
    </div>
  </div>
</div>

<!-- preview toolbar: only visible when running on fake data in a browser -->
<div id="devbar" role="toolbar" aria-label="Preview controls">
  <span class="dev-label">WINDOW</span>
  <button class="dev-btn" data-dev-mode="expanded">Expanded</button>
  <button class="dev-btn" data-dev-mode="compact">Compact</button>
  <button class="dev-btn" data-dev-view="settings">Settings</button>
  <button class="dev-btn" id="dev-quit">Quit flow</button>
  <span class="sep"></span>
  <span class="dev-label">ORB</span>
  <button class="dev-btn" data-dev-state="idle">Idle</button>
  <button class="dev-btn" data-dev-state="listening">Listening</button>
  <button class="dev-btn" data-dev-state="thinking">Thinking</button>
  <button class="dev-btn" data-dev-state="speaking">Speaking</button>
  <button class="dev-btn" data-dev-state="paused">Muted</button>
  <button class="dev-btn" data-dev-state="error">Error</button>
  <span class="sep"></span>
  <button class="dev-btn on" id="dev-demo" aria-pressed="true">Auto demo</button>
</div>

<script src="js/orb.js"></script>
<script src="js/transport.js"></script>
<script src="js/help.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
